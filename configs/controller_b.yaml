name: controller_b_partial_unknown
description: >
  Partial-unknown execution on top of Controller A. All baselines see the same
  physical plant. Only privileged training labels may use true u / full c.
default:
  gain: 1.0
  extra_lag: 1
  rate_limit: 0.05
  smooth_beta: 0.2
  episode_randomize: false
held_out_randomize:
  episode_randomize: true
  gain_range: [0.92, 1.08]
  extra_lag_choices: [0, 1, 2]
  rate_limit_range: [0.03, 0.08]
  smooth_beta_range: [0.0, 0.35]
observable_at_inference:
  - mechanical or visual state x
  - issued actions a
  - observed control summary c_obs = (target, filter, delay)
  - known_config_vector (gain, extra_lag, rate_limit, smooth_beta) when declared
hidden_at_inference:
  - FIFO queue slots
  - extra lag buffer contents
  - rate-limit / smooth internal state
  - true executed command u (train-only label)
